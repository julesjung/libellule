[package]
name = "libellule-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
name = "libellule"

[dependencies]
libellule = { version = "0.1.1", path = "../libellule" }
thiserror = "2.0.18"
time = "0.3.55"
tokio = { version = "1.53.0", features = ["full"] }
uniffi = { version = "0.31.1", features = ["tokio"] }
url = "2.5.8"

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
