[package]
name = "libellule"
version = "0.1.0"
authors = ["Jules Jung <94782485+julesjung@users.noreply.github.com>"]
edition = "2024"
description = "Unofficial implementation of the PRONOTE protocol"
readme = "README.md"
repository = "https://github.com/julesjung/libellule"
license = "GPL-3.0-or-later"
keywords = ["pronote", "client"]
categories = ["api-bindings", "authentication"]

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
hex = "0.4.3"
md5 = "0.8.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
serde_repr = "0.1.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
