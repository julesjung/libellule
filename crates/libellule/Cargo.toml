[package]
name = "libellule"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
hex = "0.4.3"
md5 = "0.8.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
serde_repr = "0.1.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
