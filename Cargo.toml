[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/julesjung/libellule"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libellule = { path = "crates/libellule", default-features = false, version = "0.1.4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", default-features = false }
uniffi = "0.32.2"
url = "2.5.8"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
