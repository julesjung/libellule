[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jules Jung <94782485+julesjung@users.noreply.github.com>"]
repository = "https://github.com/julesjung/libellule"

[workspace.dependencies]
libellule = { version = "0.1.2", path = "crates/libellule" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", default-features = false }
uniffi = "0.32.0"
url = "2.5.8"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
